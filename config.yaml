# ==============================================================================
# PersonaPlex Full-Duplex Orchestration Layer Configuration
# ==============================================================================

environment: "production"

gateway:
  host: "0.0.0.0"
  port: 8000
  workers:
    - "127.0.0.1:8998"
  rate_limit_per_minute: 60
  cors_origins:
    - "*"
  cloned_voices_dir: "data/cloned_voices"
  personas_dir: "personas"

personaplex:
  hf_repo: "nvidia/personaplex-7b-v1"
  device: "cuda"
  cpu_offload: false
  default_voice: "NATF2.pt"
  max_system_prompt_tokens: 350
  min_voice_prompt_duration_sec: 3.0
  max_voice_prompt_duration_sec: 15.0

audio:
  sample_rate: 24000
  frame_rate: 12.5
  frame_size: 1920
  frame_duration_ms: 80.0
  jitter_buffer_frames: 2
  loudness_lufs_target: -24.0

latency:
  target_ttfa_ms: 300.0
  target_frame_processing_ms: 80.0

# ==============================================================================
# Local Cascaded Voice Agent Fallback Configuration (Indic Multilingual)
# ==============================================================================

agent:
  persona_id: "indian_pro"
  agent_name: "Aarav"
  language_style: "indian_english"
  voice: "aarav_colloquial"
  speaking_rate: 0.98

llm:
  backend: "ollama"
  model: "qwen2.5:1.5b"
  alternative_model: "qwen2.5:3b"
  ollama_url: "http://127.0.0.1:11434"
  temperature: 0.7
  num_ctx: 2048
  keep_alive: "30m"

asr:
  backend: "faster-whisper"
  model_size: "base"
  device: "cpu"
  compute_type: "int8"
  language: "en"
  beam_size: 1
  vad_filter: true
  initial_prompt: "artificial intelligence, machine learning, Aarav, Priya, Chennai, Bengaluru, Tamil, Hindi, cricket, Bollywood, UPI, Swiggy, Zomato, IPL"

turn_detector:
  base_silence_sec: 0.65
  extra_silence_sec: 0.70
  speech_rms_threshold: 0.032
  min_speech_frames: 3
  preroll_frames: 4

tts:
  backend: "kokoro"
  sample_rate: 24000
  frame_size: 1920
  frame_interval_sec: 0.08
