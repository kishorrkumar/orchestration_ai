id: sarvam_stt
kind: stt
display_name: Sarvam AI
description: Specialized Indian language speech recognition (Tamil, Hindi, Indian English).
docs_url: https://docs.sarvam.ai
auth_fields:
  - name: api_key
    label: Sarvam Subscription Key
    field_type: password
    required: true
    placeholder: sarvam-api-key-...
    description: API key from dashboard.sarvam.ai
supported_languages:
  - ta-IN
  - hi-IN
  - en-IN
  - te-IN
  - bn-IN
native_sample_rates:
  - 16000
  - 8000
streaming: true
native_eot: false
default_model: saarika:v2
model_list_type: static
models:
  - id: saarika:v2
    name: Saarika v2 Realtime
    description: Ultra-accurate Indian language conversational speech-to-text.
    latency_profile: fast
    last_verified: "2026-10-01"
voices: []
pipecat_service: pipecat.services.sarvam.stt.SarvamRealtimeSTTService
