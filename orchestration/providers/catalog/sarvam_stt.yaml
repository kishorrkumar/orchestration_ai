id: sarvam_stt
kind: stt
display_name: "Sarvam AI Saaras (Indic STT)"
description: "State-of-the-art Indic speech-to-text supporting 22 Indian languages, code-mixing, and Indian English"
docs_url: "https://docs.sarvam.ai/products/speech-to-text"
streaming: true
native_eot: false
native_sample_rates:
  - 8000
  - 16000
  - 24000
supported_languages:
  - hi-IN
  - en-IN
  - ta-IN
  - te-IN
  - kn-IN
  - ml-IN
  - mr-IN
  - gu-IN
  - bn-IN
  - pa-IN
  - od-IN
  - unknown
default_model: "saaras:v4"
model_list_type: static
auth_fields:
  - name: api_key
    label: "Sarvam API Subscription Key"
    field_type: password
    required: true
    placeholder: "Paste api-subscription-key from dashboard.sarvam.ai"
    description: "Your Sarvam AI subscription key from dashboard.sarvam.ai"
models:
  - id: "saaras:v4"
    name: "Saaras v4 (Latest)"
    description: "State-of-the-art ASR with 22 Indian languages, Indian English, Global English, and verbatim/codemix modes"
    latency_profile: "fast"
    last_verified: "2026-10-15"
  - id: "saaras:v3"
    name: "Saaras v3"
    description: "Stable Indic ASR supporting 22 languages and Hinglish"
    latency_profile: "fast"
    last_verified: "2026-10-15"
pipecat_service: "pipecat.services.sarvam.stt.SarvamSTTService"
