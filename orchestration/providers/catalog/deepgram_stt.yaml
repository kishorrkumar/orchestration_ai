id: deepgram_stt
kind: stt
display_name: Deepgram
description: Ultra-low latency streaming speech recognition with native Flux turn detection.
docs_url: https://developers.deepgram.com/docs/speech-to-text
auth_fields:
  - name: api_key
    label: Deepgram API Key
    field_type: password
    required: true
    placeholder: Token abcdef123456...
    description: Get your API key from console.deepgram.com
supported_languages:
  - en-US
  - en-IN
  - hi-IN
  - es
  - fr
native_sample_rates:
  - 16000
  - 24000
  - 8000
streaming: true
native_eot: true
default_model: flux
model_list_type: static
models:
  - id: flux
    name: Deepgram Flux (Conversational EOT)
    description: Real-time speech transcription with integrated ~260ms conversational turn detection.
    latency_profile: ultra-fast
    last_verified: "2026-10-01"
  - id: nova-3
    name: Deepgram Nova-3
    description: High accuracy foundation speech model for general audio.
    latency_profile: fast
    last_verified: "2026-10-01"
  - id: nova-2
    name: Deepgram Nova-2
    description: Production workhorse multilingual speech recognition.
    latency_profile: fast
    last_verified: "2026-10-01"
voices: []
pipecat_service: pipecat.services.deepgram.flux.stt.DeepgramFluxSTTService
