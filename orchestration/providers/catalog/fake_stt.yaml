id: fake_stt
kind: stt
display_name: Fake Speech Recognition (Dev & CI)
description: Deterministic simulated speech recognizer for zero-key offline testing.
docs_url: https://github.com/kishorrkumar/orchestration_ai
auth_fields:
  - name: api_key
    label: Mock Key (Any string)
    field_type: password
    required: false
    placeholder: fake-stt-test-key
    description: Optional test key for simulated verification.
supported_languages:
  - en-US
  - ta-IN
  - hi-IN
native_sample_rates:
  - 16000
  - 8000
streaming: true
native_eot: true
default_model: mock-flux
model_list_type: static
models:
  - id: mock-flux
    name: Mock Flux Realtime
    description: Instant simulated STT yielding deterministic transcripts.
    latency_profile: ultra-fast
    last_verified: "2026-10-01"
voices: []
pipecat_service: orchestration.infrastructure.engines.cascaded.fakes.FakeSTTService
