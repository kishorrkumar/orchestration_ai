id: sarvam_tts
kind: tts
display_name: Sarvam Bulbul
description: High-fidelity natural voice synthesis for Indian languages (Tamil, Hindi, etc.).
docs_url: https://docs.sarvam.ai
auth_fields:
  - name: api_key
    label: Sarvam Subscription Key
    field_type: password
    required: true
    placeholder: sarvam-api-key-...
    description: API key from dashboard.sarvam.ai
supported_languages:
  - ta-IN
  - hi-IN
  - en-IN
  - te-IN
native_sample_rates:
  - 16000
  - 8000
streaming: true
native_eot: false
default_model: bulbul:v2
default_voice: ananya
model_list_type: static
models:
  - id: bulbul:v2
    name: Bulbul v2
    description: Expressive natural Indian language voice synthesizer.
    latency_profile: fast
    last_verified: "2026-10-01"
voices:
  - id: ananya
    name: Ananya (Tamil / English)
    gender: female
    language: ta-IN
  - id: arvind
    name: Arvind (Tamil / English)
    gender: male
    language: ta-IN
  - id: priya
    name: Priya (Hindi / English)
    gender: female
    language: hi-IN
pipecat_service: pipecat.services.sarvam.tts.SarvamTTSService
