[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestration-ai"
version = "1.0.0"
description = "Lean Speech-to-Speech Voice Agent Platform for NVIDIA PersonaPlex 7B"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PersonaPlex Core Team" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "websockets>=13.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "sqlalchemy>=2.0.0",
    "greenlet>=3.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "numpy>=1.26.0",
    "soundfile>=0.12.0",
    "scipy>=1.12.0",
    "soxr>=0.5.0",
    "sentencepiece>=0.2.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.0",
    "sphn>=0.1.4,<0.2",
    "av>=12.0.0",
    "cryptography>=43.0.0",
    "aiortc>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-PyYAML",
    "pip-audit>=2.7.0",
]
cloud-engine = [
    "pipecat-ai[deepgram,cartesia,elevenlabs,sarvam,silero]==1.12.0",
]
gpu = [
    "torch>=2.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestration*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501", "UP007", "UP035", "UP006"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"
markers = [
    "gpu: marks tests as requiring an NVIDIA GPU worker",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["orchestration.domain.*", "orchestration.application.*"]
disallow_untyped_defs = true
strict = true
